<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SECURE TERMINAL // ROOT ACCESS</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Fira+Code:wght@300;400;700&display=swap');
        
        :root {
            --bg: #05080a;
            --panel-bg: rgba(10, 20, 30, 0.7);
            --primary: #00ffcc;
            --secondary: #ff0055;
            --text: #c0c0c0;
            --border: rgba(0, 255, 204, 0.3);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background-color: var(--bg);
            color: var(--text);
            font-family: 'Fira Code', monospace;
            overflow: hidden;
            height: 100vh;
            display: grid;
            grid-template-rows: 40px 1fr 30px;
            grid-template-columns: 250px 1fr 250px;
            gap: 10px;
            padding: 10px;
            transition: background 0.3s;
        }

        /* CRT Overlay */
        body::after {
            content: " ";
            display: block;
            position: absolute;
            top: 0; left: 0; bottom: 0; right: 0;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.06));
            z-index: 999;
            background-size: 100% 2px, 3px 100%;
            pointer-events: none;
        }

        /* Panel Styling */
        .panel {
            background: var(--panel-bg);
            border: 1px solid var(--border);
            box-shadow: 0 0 10px rgba(0, 255, 204, 0.1);
            padding: 10px;
            position: relative;
            overflow: hidden;
        }
        
        .panel::before {
            content: '';
            position: absolute;
            top: 0; left: 0; width: 10px; height: 10px;
            border-top: 2px solid var(--primary);
            border-left: 2px solid var(--primary);
        }
        .panel::after {
            content: '';
            position: absolute;
            bottom: 0; right: 0; width: 10px; height: 10px;
            border-bottom: 2px solid var(--primary);
            border-right: 2px solid var(--primary);
        }

        /* Header */
        .header {
            grid-column: 1 / -1;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 15px;
            font-weight: bold;
            color: var(--primary);
            text-transform: uppercase;
            letter-spacing: 2px;
            border-bottom: 1px solid var(--border);
            box-shadow: 0 0 20px rgba(0, 255, 204, 0.2);
            background: #0a1015;
        }

        .header .blink { animation: blink 1s step-end infinite; }
        @keyframes blink { 50% { opacity: 0; } }

        /* Left Column */
        .left-panel { grid-row: 2; grid-column: 1; display: flex; flex-direction: column; gap: 10px; }
        .log { font-size: 11px; color: #888; margin-bottom: 5px; }
        .log span { color: var(--primary); }

        /* Center Column */
        .center-panel { grid-row: 2; grid-column: 2; display: flex; flex-direction: column; gap: 10px; }
        .radar-container {
            flex: 1;
            position: relative;
            background: radial-gradient(circle, rgba(0,255,204,0.05) 0%, transparent 70%);
            display: flex;
            justify-content: center;
            align-items: center;
        }
        canvas#radar { width: 100%; height: 100%; }

        .progress-container { margin-top: auto; }
        .progress-label { display: flex; justify-content: space-between; font-size: 12px; color: var(--primary); margin-bottom: 5px; }
        .progress-bar {
            width: 100%; height: 15px;
            background: rgba(0, 255, 204, 0.1);
            border: 1px solid var(--primary);
            position: relative;
            overflow: hidden;
        }
        .progress-fill {
            height: 100%; width: 0%;
            background: var(--primary);
            box-shadow: 0 0 10px var(--primary);
            transition: width 0.1s linear;
        }

        /* Right Column */
        .right-panel { grid-row: 2; grid-column: 3; display: flex; flex-direction: column; }
        .hex-dump {
            font-size: 10px; line-height: 1.2;
            color: #4a9f8b; flex: 1;
            overflow: hidden;
            word-break: break-all;
        }

        /* Bottom Terminal */
        .terminal-panel {
            grid-column: 1 / -1; grid-row: 3;
            display: flex; align-items: center;
            padding: 0 15px; font-size: 14px;
            background: rgba(0, 0, 0, 0.8);
        }
        .prompt { color: var(--primary); margin-right: 10px; }
        .cmd-text { color: #fff; }
        .cursor {
            display: inline-block; width: 8px; height: 15px;
            background-color: var(--primary); margin-left: 5px;
            animation: blink 1s step-end infinite;
        }

        /* Red Alert Mode */
        .alert-mode { --primary: #ff0055; --border: rgba(255, 0, 85, 0.5); }
        .alert-mode .panel { box-shadow: 0 0 15px rgba(255, 0, 85, 0.3); }
        .alert-mode .header { color: var(--primary); box-shadow: 0 0 20px rgba(255, 0, 85, 0.3); }
        
        /* Glitch Effect */
        .glitch { animation: shake 0.2s cubic-bezier(.36,.07,.19,.97) both; }
        @keyframes shake {
            10%, 90% { transform: translate3d(-2px, 0, 0); }
            20%, 80% { transform: translate3d(4px, 0, 0); }
            30%, 50%, 70% { transform: translate3d(-6px, 0, 0); }
            40%, 60% { transform: translate3d(6px, 0, 0); }
        }

        /* Invert Color Flash */
        .invert { filter: invert(1); }

        /* --- SCARY ERROR POPUP --- */
        .error-modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.9);
            z-index: 10000;
            justify-content: center;
            align-items: center;
            backdrop-filter: blur(8px);
        }

        .error-content {
            background: #0a0000;
            border: 3px solid #ff0000;
            box-shadow: 0 0 50px #ff0000, inset 0 0 30px #ff0000;
            padding: 50px;
            text-align: center;
            max-width: 700px;
            width: 90%;
            animation: pulse-red 1.5s infinite, shake 0.5s infinite;
            font-family: 'Courier New', Courier, monospace;
        }

        @keyframes pulse-red {
            0% { box-shadow: 0 0 50px #ff0000, inset 0 0 30px #ff0000; border-color: #ff0000; }
            50% { box-shadow: 0 0 100px #ff0000, inset 0 0 60px #ff0000; border-color: #ff4444; }
            100% { box-shadow: 0 0 50px #ff0000, inset 0 0 30px #ff0000; border-color: #ff0000; }
        }

        .warning-icon {
            font-size: 100px;
            color: #ff0000;
            text-shadow: 0 0 30px #ff0000;
            margin-bottom: 20px;
            animation: shake 0.3s infinite;
        }

        .error-content h1 {
            color: #ff0000;
            font-size: 36px;
            margin-bottom: 20px;
            text-transform: uppercase;
            letter-spacing: 4px;
            text-shadow: 0 0 20px #ff0000;
        }

        .error-content p {
            color: #ffcccc;
            font-size: 18px;
            margin-bottom: 15px;
            letter-spacing: 2px;
        }

        .error-code {
            font-size: 28px !important;
            color: #ff0000 !important;
            font-weight: bold;
            background: #000;
            padding: 15px;
            border: 2px dashed #ff0000;
            margin: 20px 0;
            animation: blink 1s step-end infinite;
        }

        .threat {
            font-size: 22px !important;
            color: #ffff00 !important;
            font-weight: bold;
            animation: blink 0.5s step-end infinite;
        }

        .close-btn {
            background: #ff0000;
            color: #000;
            border: none;
            padding: 20px 40px;
            font-size: 20px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 30px;
            text-transform: uppercase;
            font-family: inherit;
            transition: all 0.2s;
            box-shadow: 0 0 20px #ff0000;
        }

        .close-btn:hover {
            background: #fff;
            color: #ff0000;
            box-shadow: 0 0 40px #fff;
            transform: scale(1.05);
        }
    </style>
</head>
<body>

    <div class="header">
        <div>SECURE TERMINAL // ACCESS LEVEL: ROOT</div>
        <div>TARGET: 192.168.1.1 <span class="blink">_</span></div>
    </div>

    <div class="panel left-panel">
        <div style="color: var(--primary); margin-bottom: 10px; font-weight: bold;">SYSTEM LOGS</div>
        <div id="logs"></div>
    </div>

    <div class="panel center-panel">
        <div class="radar-container">
            <canvas id="radar"></canvas>
        </div>
        <div class="progress-container">
            <div class="progress-label">
                <span id="progress-text">EXTRACTING DATA...</span>
                <span id="progress-percent">0%</span>
            </div>
            <div class="progress-bar">
                <div class="progress-fill" id="progress-fill"></div>
            </div>
        </div>
    </div>

    <div class="panel right-panel">
        <div style="color: var(--primary); margin-bottom: 10px; font-weight: bold;">MEMORY DUMP</div>
        <div class="hex-dump" id="hex"></div>
    </div>

    <div class="panel terminal-panel">
        <span class="prompt">root@kali:~#</span>
        <span class="cmd-text" id="cmd"></span>
        <span class="cursor"></span>
    </div>

    <!-- THE SCARY POPUP -->
    <div class="error-modal" id="error-modal">
        <div class="error-content">
            <div class="warning-icon">⚠️</div>
            <h1>CRITICAL SYSTEM ERROR</h1>
            <p>UNAUTHORIZED ACCESS DETECTED</p>
            <div class="error-code">ERROR CODE: 0x000000F4</div>
            <p class="threat">YOUR IDENTITY HAS BEEN COMPROMISED!!!</p>
            <p style="font-size: 14px; color: #888; margin-top: 15px;">CONNECTION TERMINATED BY REMOTE HOST</p>
            <button class="close-btn" id="close-btn">TERMINATE CONNECTION</button>
        </div>
    </div>

<script>
    // --- RADAR ANIMATION ---
    const radarCanvas = document.getElementById('radar');
    const rCtx = radarCanvas.getContext('2d');
    let angle = 0;

    function resizeRadar() {
        radarCanvas.width = radarCanvas.parentElement.clientWidth;
        radarCanvas.height = radarCanvas.parentElement.clientHeight;
    }
    window.addEventListener('resize', resizeRadar);
    resizeRadar();

    function drawRadar() {
        rCtx.clearRect(0, 0, radarCanvas.width, radarCanvas.height);
        const cx = radarCanvas.width / 2;
        const cy = radarCanvas.height / 2;
        const radius = Math.min(cx, cy) * 0.8;

        // Grid
        rCtx.strokeStyle = 'rgba(0, 255, 204, 0.2)';
        rCtx.lineWidth = 1;
        for (let i = 1; i <= 4; i++) {
            rCtx.beginPath();
            rCtx.arc(cx, cy, radius * (i / 4), 0, Math.PI * 2);
            rCtx.stroke();
        }
        rCtx.beginPath(); rCtx.moveTo(cx - radius, cy); rCtx.lineTo(cx + radius, cy); rCtx.stroke();
        rCtx.beginPath(); rCtx.moveTo(cx, cy - radius); rCtx.lineTo(cx, cy + radius); rCtx.stroke();

        // Sweep
        angle += 0.05;
        const grad = rCtx.createConicGradient(angle, cx, cy);
        grad.addColorStop(0, 'rgba(0, 255, 204, 0.8)');
        grad.addColorStop(0.1, 'rgba(0, 255, 204, 0)');
        grad.addColorStop(1, 'rgba(0, 255, 204, 0)');
        
        rCtx.fillStyle = grad;
        rCtx.beginPath();
        rCtx.moveTo(cx, cy);
        rCtx.arc(cx, cy, radius, angle, angle + Math.PI / 4);
        rCtx.fill();

        // Blips
        rCtx.fillStyle = '#ff0055';
        for (let i = 0; i < 5; i++) {
            const bx = cx + (Math.random() - 0.5) * radius * 1.5;
            const by = cy + (Math.random() - 0.5) * radius * 1.5;
            if (Math.hypot(bx - cx, by - cy) < radius) {
                rCtx.beginPath();
                rCtx.arc(bx, by, 2, 0, Math.PI * 2);
                rCtx.fill();
            }
        }

        requestAnimationFrame(drawRadar);
    }
    drawRadar();

    // --- MEMORY DUMP ---
    const hexDiv = document.getElementById('hex');
    const hexChars = '0123456789ABCDEF';
    setInterval(() => {
        let str = '';
        for (let i = 0; i < 5; i++) {
            let line = '0x' + Math.floor(Math.random()*16777215).toString(16).toUpperCase().padStart(6, '0') + '  ';
            for (let j = 0; j < 8; j++) {
                line += hexChars[Math.floor(Math.random()*16)] + hexChars[Math.floor(Math.random()*16)] + ' ';
            }
            str += line + '<br>';
        }
        hexDiv.innerHTML = str;
    }, 50);

    // --- SYSTEM LOGS ---
    const logsDiv = document.getElementById('logs');
    const logMessages = [
        'Bypassing firewall...', 'Injecting payload...', 'Escalating privileges...',
        'Connecting to C2 server...', 'Downloading payload...', 'Dumping SAM hashes...',
        'Cracking passwords...', 'Exfiltrating data...', 'Covering tracks...',
        'Accessing root directory...', 'Modifying registry...', 'Disabling antivirus...'
    ];
    setInterval(() => {
        const msg = logMessages[Math.floor(Math.random() * logMessages.length)];
        const ip = `${Math.floor(Math.random()*255)}.${Math.floor(Math.random()*255)}.${Math.floor(Math.random()*255)}.${Math.floor(Math.random()*255)}`;
        const time = new Date().toLocaleTimeString();
        const log = document.createElement('div');
        log.className = 'log';
        log.innerHTML = `[${time}] <span>[${ip}]</span> ${msg}`;
        logsDiv.appendChild(log);
        if (logsDiv.children.length > 15) logsDiv.removeChild(logsDiv.firstChild);
    }, 300);

    // --- TERMINAL COMMAND TYPING ---
    const cmdDiv = document.getElementById('cmd');
    const commands = [
        'nmap -sS -A 192.168.1.1',
        'msfconsole -q',
        'use exploit/windows/smb/ms17_010_eternalblue',
        'set RHOSTS 192.168.1.1',
        'exploit',
        'hashcat -m 1000 hashes.txt rockyou.txt',
        'sqlmap -u http://target.com/login --dbs',
        'aircrack-ng -w wordlist.txt capture.cap'
    ];
    let cmdIndex = 0;
    let charIndex = 0;
    
    function typeCommand() {
        if (cmdIndex >= commands.length) return;
        const cmd = commands[cmdIndex];
        if (charIndex < cmd.length) {
            cmdDiv.innerHTML += cmd[charIndex];
            charIndex++;
            setTimeout(typeCommand, 50);
        } else {
            setTimeout(() => {
                cmdDiv.innerHTML = '';
                cmdIndex++;
                charIndex = 0;
                typeCommand();
            }, 1000);
        }
    }
    setTimeout(typeCommand, 2000);

    // --- PROGRESS BAR & SCARY TRIGGER ---
    const progressFill = document.getElementById('progress-fill');
    const progressPercent = document.getElementById('progress-percent');
    let progress = 0;
    let triggered = false;
    
    const progressInterval = setInterval(() => {
        progress += Math.random() * 5;
        if (progress >= 100) {
            progress = 100;
            clearInterval(progressInterval);
            
            if (!triggered) {
                triggered = true;
                
                // 1. Glitch and Red Alert
                document.body.classList.add('glitch');
                document.body.classList.add('alert-mode');
                document.getElementById('progress-text').innerText = 'SYSTEM BREACHED';
                setTimeout(() => document.body.classList.remove('glitch'), 500);

                // 2. Invert colors for a split second
                setTimeout(() => {
                    document.body.classList.add('invert');
                    setTimeout(() => document.body.classList.remove('invert'), 200);
                }, 800);

                // 3. Show the scary popup
                setTimeout(() => {
                    document.getElementById('error-modal').style.display = 'flex';
                    // Shake the whole screen again
                    document.body.classList.add('glitch');
                    setTimeout(() => document.body.classList.remove('glitch'), 500);
                }, 1000);
            }
        }
        progressFill.style.width = progress + '%';
        progressPercent.innerText = Math.floor(progress) + '%';
    }, 100);

    // --- CLOSE BUTTON ---
    document.getElementById('close-btn').addEventListener('click', () => {
        document.getElementById('error-modal').style.display = 'none';
        document.body.classList.remove('alert-mode');
        // Reset progress
        progress = 0;
        triggered = false;
        progressFill.style.width = '0%';
        progressPercent.innerText = '0%';
        document.getElementById('progress-text').innerText = 'EXTRACTING DATA...';
        // Restart interval
        setIntervalLogic();
    });

    function setIntervalLogic() {
        const newInterval = setInterval(() => {
            progress += Math.random() * 5;
            if (progress >= 100) {
                progress = 100;
                clearInterval(newInterval);
                if (!triggered) {
                    triggered = true;
                    document.body.classList.add('glitch');
                    document.body.classList.add('alert-mode');
                    document.getElementById('progress-text').innerText = 'SYSTEM BREACHED';
                    setTimeout(() => document.body.classList.remove('glitch'), 500);
                    setTimeout(() => {
                        document.body.classList.add('invert');
                        setTimeout(() => document.body.classList.remove('invert'), 200);
                    }, 800);
                    setTimeout(() => {
                        document.getElementById('error-modal').style.display = 'flex';
                        document.body.classList.add('glitch');
                        setTimeout(() => document.body.classList.remove('glitch'), 500);
                    }, 1000);
                }
            }
            progressFill.style.width = progress + '%';
            progressPercent.innerText = Math.floor(progress) + '%';
        }, 100);
    }

</script>
</body>
</html>
